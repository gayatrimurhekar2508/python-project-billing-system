<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 3 - Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <div class="navbar">
        <div class="logo">Skill Nexis | Week 1</div>
        <nav>
            <a href="index.html">Task 1</a>
            <a href="table.html">Task 2</a>
            <a class="active" href="registration.html">Task 3</a>
            <a href="home.html">Task 4</a>
        </nav>
    </div>
</header>

<main>
    <section class="form-card">
        <span class="badge">Task 3</span>
        <h1>Student Registration</h1>
        <p>Fill in the details below to register.</p>

        <form action="#" method="post">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input id="name" type="text" name="name" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input id="email" type="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" type="password" name="password" placeholder="Create a password" required>
            </div>

            <div class="form-group">
                <label>Gender</label>
                <div class="radio-group">
                    <label><input type="radio" name="gender" value="male"> Male</label>
                    <label><input type="radio" name="gender" value="female"> Female</label>
                    <label><input type="radio" name="gender" value="other"> Other</label>
                </div>
            </div>

            <div class="form-group">
                <label for="course">Course</label>
                <select id="course" name="course" required>
                    <option value="">-- Select Course --</option>
                    <option>ENTC</option>
                    <option>Computer Engineering</option>
                    <option>Information Technology</option>
                    <option>Mechanical Engineering</option>
                </select>
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="4" placeholder="Write a short message"></textarea>
            </div>

            <button class="btn" type="submit">Register</button>
            <button class="btn" type="reset">Reset</button>
        </form>
    </section>
</main>

<footer>Skill Nexis Internship • Week 1 • HTML Basics</footer>
</body>
</html>
